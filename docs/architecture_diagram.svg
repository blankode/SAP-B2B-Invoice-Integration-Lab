<svg width="1400" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 2; rx: 12; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #111; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #333; }
      .arrow { stroke: #333; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="40" y="45" class="title">SAP B2B Invoice Integration Lab - Architecture</text>

  <rect x="40" y="100" width="150" height="90" class="box"/>
  <text x="65" y="135" class="title">Partner</text>
  <text x="65" y="162" class="small">UBL / cXML</text>
  <text x="65" y="182" class="small">EDIFACT / X12</text>

  <line x1="190" y1="145" x2="250" y2="145" class="arrow"/>

  <rect x="250" y="100" width="170" height="90" class="box"/>
  <text x="275" y="135" class="title">Detect</text>
  <text x="275" y="162" class="small">Document type</text>

  <line x1="420" y1="145" x2="480" y2="145" class="arrow"/>

  <rect x="480" y="100" width="170" height="90" class="box"/>
  <text x="505" y="135" class="title">Parse</text>
  <text x="505" y="162" class="small">Extract fields</text>

  <line x1="650" y1="145" x2="710" y2="145" class="arrow"/>

  <rect x="710" y="100" width="190" height="90" class="box"/>
  <text x="735" y="135" class="title">Canonical</text>
  <text x="735" y="162" class="small">Invoice JSON</text>

  <line x1="900" y1="145" x2="960" y2="145" class="arrow"/>

  <rect x="960" y="100" width="170" height="90" class="box"/>
  <text x="985" y="135" class="title">Validate</text>
  <text x="985" y="162" class="small">Business rules</text>

  <line x1="1130" y1="145" x2="1190" y2="145" class="arrow"/>

  <rect x="1190" y="100" width="170" height="90" class="box"/>
  <text x="1215" y="135" class="title">Map</text>
  <text x="1215" y="162" class="small">SAP IDoc XML</text>

  <rect x="480" y="260" width="170" height="90" class="box"/>
  <text x="505" y="295" class="title">Route</text>
  <text x="505" y="322" class="small">AS2 / SFTP</text>

  <rect x="730" y="260" width="210" height="90" class="box"/>
  <text x="755" y="295" class="title">Transport</text>
  <text x="755" y="322" class="small">Simulated send</text>

  <rect x="1020" y="260" width="250" height="90" class="box"/>
  <text x="1045" y="295" class="title">Monitoring</text>
  <text x="1045" y="322" class="small">Report + dashboard</text>

  <line x1="1275" y1="190" x2="620" y2="260" class="arrow"/>
  <line x1="650" y1="305" x2="730" y2="305" class="arrow"/>
  <line x1="940" y1="305" x2="1020" y2="305" class="arrow"/>
</svg>
